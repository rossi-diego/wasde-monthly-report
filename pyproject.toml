[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wasde"
version = "0.1.0"
description = "Production-grade USDA agricultural data pipeline — Airflow + DuckDB + FastAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "duckdb>=0.10",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=8.2",
    "lxml>=5.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
pipelines = [
    "apache-airflow>=2.9",
    "pendulum>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wasde"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true
disallow_untyped_calls = false
strict = false
disable_error_code = ["import-untyped", "no-any-return"]

[tool.coverage.run]
source = ["src/wasde"]
omit = ["tests/*", "dags/*"]

[tool.coverage.report]
fail_under = 40
