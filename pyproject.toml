[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "usda-reports"
version = "2.1.0"
description = "USDA reports data product (WASDE first): complete harmonized history, auto-updated on every release."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Diego Rossi" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "lxml>=5.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "tenacity>=8.5",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dbt = ["dbt-duckdb>=1.8"]
dev = [
    "frictionless>=5.18",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
usda-reports = "usda_reports.cli:main"
# Deprecated alias, kept for one release.
wasde = "usda_reports.cli:legacy_main"

[tool.hatch.build.targets.wheel]
packages = ["src/usda_reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
markers = [
    "network: hits real endpoints (skipped unless USDA_LIVE_TESTS=1)",
    "slow: full rebuild from the real bronze store (skipped when bronze is absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length is owned by `ruff format`

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["usda_reports"]
omit = ["*/cli.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true
