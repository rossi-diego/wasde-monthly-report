name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# This re-enables the release workflow monthly, independently of whether a report landed.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow enable release.yml -R "$REPO"
          gh workflow enable keepalive.yml -R "$REPO"
