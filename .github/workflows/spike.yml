name: Spike - source reachability

on:
  push:
    branches: [reformulation-v2]
    paths: [.github/workflows/spike.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sources from a GitHub-hosted runner
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          probe() { code=$(curl -s -o out.bin -w '%{http_code}' -L --max-time 60 -A "$2" "$1"); echo "$code $(stat -c%s out.bin) [$3] $1"; head -c 120 out.bin | tr -d '\r' | head -2; echo; }
          probe "https://www.usda.gov/sites/default/files/documents/oce-wasde-report-data-2026-10.csv" "$UA" browser-ua
          probe "https://www.usda.gov/sites/default/files/documents/oce-wasde-report-data-2026-10.csv" "python-requests/2.32.3" python-ua
          probe "https://www.usda.gov/about-usda/general-information/staff-offices/office-chief-economist/commodity-markets/wasde-report" "$UA" calendar-page
          probe "https://www.usda.gov/oce/commodity/wasde/wasde1026.xml" "$UA" oce-xml
          probe "https://esmis.nal.usda.gov/api/v1/release/findByIdentifier/wasde?page=0" "python-requests/2.32.3" esmis-api
          probe "https://esmis.nal.usda.gov/sites/default/release-files/796099/wasde1026.xml" "python-requests/2.32.3" esmis-xml
