name: Monthly Data Update

on:
  schedule:
    - cron: "0 14 12 * *"    # 12th of each month, 14:00 UTC
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  update:
    name: Fetch & Update Data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e "."

      - name: Run Bronze + Silver + Gold pipeline
        env:
          USDA_PSD_KEY: ${{ secrets.USDA_PSD_KEY }}
        run: |
          python - <<'PIPELINE'
          import logging, os, sys
          from datetime import date
          from wasde.config import settings, configure_logging

          configure_logging()
          log = logging.getLogger("pipeline")
          run_date = date.today()
          api_key = os.environ.get("USDA_PSD_KEY", "")

          settings.bronze_dir.mkdir(parents=True, exist_ok=True)
          settings.silver_dir.mkdir(parents=True, exist_ok=True)

          succeeded = []
          failed = []

          # ── WASDE CSV download (individual monthly files, cached) ──

          import requests as _req
          from dateutil.relativedelta import relativedelta
          from pathlib import Path

          bronze_wasde = settings.bronze_dir / "wasde"
          bronze_wasde.mkdir(parents=True, exist_ok=True)
          downloaded = []
          cached = []

          for i in range(24):
              d = run_date - relativedelta(months=i)
              out = bronze_wasde / f"wasde_{d.year}_{d.month:02d}.csv"
              if out.exists() and out.stat().st_size > 100:
                  cached.append(out.name)
                  continue
              url = f"https://www.usda.gov/sites/default/files/documents/oce-wasde-report-data-{d.year}-{d.month:02d}.csv"
              try:
                  resp = _req.get(url, timeout=30)
                  if resp.status_code == 200 and len(resp.content) > 100:
                      out.write_bytes(resp.content)
                      downloaded.append(out.name)
                      log.info("Downloaded WASDE %d-%02d", d.year, d.month)
                  else:
                      log.debug("WASDE %d-%02d not available (HTTP %d)", d.year, d.month, resp.status_code)
              except Exception as e:
                  log.warning("WASDE %d-%02d failed: %s", d.year, d.month, e)

          log.info("WASDE CSVs — downloaded: %d, cached: %d", len(downloaded), len(cached))

          if downloaded or cached:
              try:
                  from wasde.pipelines.silver.wasde_csv import transform_wasde
                  transform_wasde(bronze_wasde, settings.silver_dir / "wasde.parquet")
                  succeeded.append("wasde")
                  log.info("Silver WASDE built from %d CSV files", len(downloaded) + len(cached))
              except Exception as e:
                  log.warning("Silver WASDE transform failed: %s", e)
                  failed.append("wasde")
          else:
              log.warning("No WASDE CSVs available")
              failed.append("wasde")

          # ── Bronze (other sources) ───────────────────────────────

          # PSD (requires USDA API key)
          psd_bz = None
          if api_key:
              try:
                  from wasde.pipelines.bronze.psd import extract_psd
                  log.info("Bronze: PSD")
                  psd_bz = extract_psd(api_key, run_date, settings.bronze_dir / "psd")
                  succeeded.append("psd")
              except Exception as e:
                  log.warning("Bronze PSD failed: %s", e)
                  failed.append("psd")
          else:
              log.warning("Skipping PSD — USDA_PSD_KEY not set")
              failed.append("psd")

          # NOPA (web scrape — URL may change)
          nopa_bz = None
          try:
              from wasde.pipelines.bronze.nopa import extract_nopa
              log.info("Bronze: NOPA")
              nopa_bz = extract_nopa(run_date, settings.bronze_dir / "nopa")
              if nopa_bz:
                  succeeded.append("nopa")
              else:
                  failed.append("nopa")
          except Exception as e:
              log.warning("Bronze NOPA failed: %s", e)
              failed.append("nopa")

          # Exports (USDA FAS — no key needed)
          exports_bz = None
          try:
              from wasde.pipelines.bronze.exports import extract_exports
              log.info("Bronze: Exports")
              exports_bz = extract_exports(run_date, settings.bronze_dir / "exports")
              succeeded.append("exports")
          except Exception as e:
              log.warning("Bronze Exports failed: %s", e)
              failed.append("exports")

          log.info("Bronze results — succeeded: %s, failed: %s", succeeded, failed)

          if not succeeded:
              log.error("ALL bronze extractors failed — aborting pipeline")
              sys.exit(1)

          # ── Silver ────────────────────────────────────────────────

          # WASDE silver already built in the CSV download section above

          if psd_bz:
              try:
                  from wasde.pipelines.silver.psd import transform_psd
                  log.info("Silver: PSD")
                  transform_psd(psd_bz, settings.silver_dir / "psd.parquet")
              except Exception as e:
                  log.warning("Silver PSD failed: %s", e)

          if nopa_bz:
              try:
                  from wasde.pipelines.silver.nopa import transform_nopa
                  log.info("Silver: NOPA")
                  transform_nopa(nopa_bz, settings.silver_dir / "nopa.parquet")
              except Exception as e:
                  log.warning("Silver NOPA failed: %s", e)

          if exports_bz:
              try:
                  from wasde.pipelines.silver.exports import transform_exports
                  log.info("Silver: Exports")
                  transform_exports(exports_bz, settings.silver_dir / "exports.parquet")
              except Exception as e:
                  log.warning("Silver Exports failed: %s", e)

          # ── Gold ──────────────────────────────────────────────────

          try:
              from wasde.pipelines.gold.metrics import build_gold
              log.info("Gold: building DuckDB")
              build_gold()
          except Exception as e:
              log.warning("Gold build failed: %s", e)

          log.info("Pipeline complete. Succeeded: %s, Failed: %s", succeeded, failed)
          PIPELINE

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/wasde.duckdb || true
          git add -f data/silver/ || true
          git add -f data/bronze/wasde/ || true
          git diff --staged --quiet || git commit -m "data: monthly pipeline update $(date +%Y-%m)"
          git pull --rebase origin main || true
          git push
