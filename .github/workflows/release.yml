name: WASDE release

# Detects a new WASDE report on its official release day, rebuilds bronze → silver → gold,
# publishes a versioned GitHub data release, redeploys the site and verifies it live.
# Also redeploys on code changes (with the current data) and can be run manually.

on:
  schedule:
    # Every 30 min, 16:05–21:35 UTC. WASDE is out at 12:00 ET (16:00 UTC in summer, 17:00
    # in winter). `wasde detect` exits fast unless a scheduled release is due and missing.
    - cron: "5,35 16-21 * * *"
  workflow_dispatch:
    inputs:
      force_month:
        description: "Re-ingest this report month (YYYY-MM) even if present"
        required: false
      redeploy_only:
        description: "Skip detection; rebuild site from the latest data release"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "src/**", "dbt/**", "config/**", ".github/workflows/release.yml"]

concurrency:
  group: wasde-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

env:
  WASDE_LOG_JSON: "true"
  VERCEL_PROJECT: wasde-tracker

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv pip install -e ".[dbt]"

      - name: Restore manifest from the latest data release (source of truth)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --exclude-drafts --limit 50 --json tagName -q '[.[] | select(.tagName | startswith("data-"))][0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then gh release download "$tag" --pattern manifest.json --dir data --clobber; fi

      - name: Refresh official release calendar
        continue-on-error: true
        run: wasde refresh-calendar

      - name: Detect and ingest a new report
        id: detect
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.redeploy_only)
        run: wasde detect ${{ inputs.force_month && format('--force-month {0}', inputs.force_month) || '' }}

      - name: Decide what to do
        id: plan
        run: |
          if [ "${{ steps.detect.outputs.new_report }}" = "true" ]; then
            echo "mode=new" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "mode=redeploy" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore bronze archive
        if: steps.plan.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.prev.outputs.tag }}" --pattern bronze.tar.gz --dir /tmp
          wasde unpack-bronze /tmp/bronze.tar.gz
          wasde backfill   # verifies nothing else is missing (cheap when complete)

      - name: Build silver → gold → publish
        if: steps.plan.outputs.mode == 'new'
        id: build
        run: |
          month=$(python -c "import json;print(max(json.load(open('data/manifest.json'))['reports']))")
          echo "tag=data-$month" >> "$GITHUB_OUTPUT"
          echo "month=$month" >> "$GITHUB_OUTPUT"
          wasde run --tag "data-$month"
          wasde pack-bronze data/publish/bronze.tar.gz
          cp data/manifest.json data/publish/manifest.json
          tar -czf data/publish/web-data.tar.gz -C web/public data

      - name: Publish versioned data release (draft → assets → public)
        if: steps.plan.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.build.outputs.tag }}"
          label=$(python -c "import json;print(json.load(open('web/public/data/meta.json'))['latest']['label'])")
          notes=$(python - <<'PY'
          import json
          o = json.load(open("web/public/data/overview.json", encoding="utf-8"))
          print("Automated WASDE data release.\n\n### Headlines\n" + "\n".join(f"- {h['sentence']}" for h in o["highlights"]))
          PY
          )
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" --draft --title "WASDE $label" --notes "$notes"
          gh release upload "$tag" data/publish/* --clobber
          gh release edit "$tag" --draft=false --latest

      - name: Get site data (redeploy with the latest release)
        if: steps.plan.outputs.mode == 'redeploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.prev.outputs.tag }}" --pattern web-data.tar.gz --dir /tmp
          mkdir -p web/public && tar -xzf /tmp/web-data.tar.gz -C web/public

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.mode != 'none'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and deploy to Vercel (prebuilt static site)
        if: steps.plan.outputs.mode != 'none'
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret is not set"; exit 1; fi
          npm ci
          scope=${VERCEL_SCOPE:+--scope $VERCEL_SCOPE}
          npx vercel@latest link --yes --project "$VERCEL_PROJECT" $scope --token "$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production $scope --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod $scope --token "$VERCEL_TOKEN"
          url=$(npx vercel@latest deploy --prebuilt --prod $scope --token "$VERCEL_TOKEN")
          echo "deployment=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live site shows the new report
        if: steps.plan.outputs.mode != 'none'
        working-directory: web
        env:
          # Production domain (unique deployment URLs sit behind Vercel deployment protection).
          E2E_BASE_URL: ${{ vars.SITE_URL || 'https://wasde-tracker.vercel.app' }}
        run: |
          export EXPECTED_REPORT_LABEL=$(python -c "import json;print(json.load(open('public/data/meta.json'))['latest']['label'])")
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop

      - name: Record manifest and calendar in git (audit trail + repo activity)
        if: steps.plan.outputs.mode == 'new'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json config/release_calendar.yaml
          git diff --staged --quiet || git commit -m "data: WASDE ${{ steps.build.outputs.month }}"
          git pull --rebase origin main && git push

      - name: Heartbeat
        if: always() && github.event_name == 'schedule'
        env:
          HC: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          [ -z "$HC" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 "$HC" >/dev/null; else curl -fsS -m 10 "$HC/fail" >/dev/null; fi

      - name: Open or update the pipeline-alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} failed (event: ${{ github.event_name }}, overdue: ${{ steps.detect.outputs.overdue }})."
          gh label create pipeline-alert --color B60205 --force >/dev/null
          num=$(gh issue list --label pipeline-alert --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --title "WASDE pipeline needs attention" --label pipeline-alert --body "$body"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            gh issue comment "$num" --body "$body"   # scheduled retries every 30 min stay quiet
          fi
