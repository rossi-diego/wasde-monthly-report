name: Data release

# Release days (WASDE monthly 12:00 ET, Export Sales weekly Thursday 08:30 ET, NASS crush monthly
# ~1st business day 15:00 ET, NASS Crop Progress weekly Monday 16:00 ET April-November, NASS
# Grain Stocks quarterly 12:00 ET): detect what is
# new, rebuild bronze → silver → gold, deploy the site, verify it live, and only then publish
# the versioned data release (the commit point). Anything that fails before that point is
# retried automatically by the next scheduled run.
#
# A light `gate` job runs first and exits in well under a minute when nothing is due (no
# bronze restore, no source calls), so the Actions history stays readable.
#
# Modes (release job)
#   new      a new WASDE report (or a revised edition)  → data-YYYY-MM, marked Latest
#   weekly   new Export Sales, NASS crush, Crop Progress → immutable prerelease weekly-YYYY-MM-DD
#            or Grain Stocks content (no new WASDE)        (--latest=false; data-* stays Latest;
#                                                          named after the build day, .2/.3… when
#                                                          that tag exists)
#   rebuild  code/config changed, or the live site is behind main / the newest data release
#   none     nothing to do (watchdogs still ran)
#
# Release/tag contract (plan §7, protects Soy Outlook): releases/latest is always a data-* tag
# carrying meta.json (data_release_tag, next_release, latest, reports…) and wasde_full.parquet.

on:
  schedule:
    # Every 30 min, 12:05–23:35 UTC on weekdays: covers ESR (08:30 ET = 12:30/13:30 UTC), WASDE
    # and Grain Stocks (12:00 ET = 16:00/17:00 UTC), NASS crush (15:00 ET = 19:00/20:00 UTC) and
    # Crop Progress (Monday 16:00 ET = 20:00/21:00 UTC; a late NASS posting is picked up by
    # Tuesday's first run, plan §11) in both DST offsets. ET-clock guards live in
    # `usda-reports due` / `detect`.
    - cron: "5,35 12-23 * * 1-5"
  workflow_dispatch:
    inputs:
      force_month:
        description: "Re-ingest this WASDE report month (YYYY-MM)"
        required: false
      force_export_sales:
        description: "Re-pull the newest Export Sales release even if it is already ingested"
        type: boolean
        default: false
      force_oilseed_crush:
        description: "Re-check the newest NASS Fats & Oils releases on ESMIS even if not due"
        type: boolean
        default: false
      force_crop_progress:
        description: "Re-check the newest NASS Crop Progress releases on ESMIS even if not due"
        type: boolean
        default: false
      force_grain_stocks:
        description: "Re-check the newest NASS Grain Stocks releases on ESMIS even if not due"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "src/**", "dbt/**", "config/**", ".github/workflows/release.yml"]

concurrency:
  group: data-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  USDA_LOG_JSON: "true"
  BRONZE_STORE: bronze-store
  VERCEL_PROJECT: usda-reports
  SITE_URL: ${{ vars.SITE_URL || 'https://usda-reports.vercel.app' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
      prev_tag: ${{ steps.prev.outputs.tag }}
      behind: ${{ steps.live.outputs.behind }}
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true
      - run: uv pip install -e .

      - name: Newest data release (data-* or weekly-*) and its manifest
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --exclude-drafts --limit 50 --json tagName -q '[.[] | select(.tagName | test("^(data|weekly)-"))][0].tagName')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then
            gh release download "$tag" --pattern manifest.json --dir /tmp/prev --clobber
            cp /tmp/prev/manifest.json data/manifest.json
          fi

      - name: What is due (calendar only, no source calls)
        id: due
        run: usda-reports due --json

      - name: Is the live site current? (code commit and data tag)
        id: live
        if: github.event_name == 'schedule'
        run: |
          live=$(curl -fsS -m 20 "$SITE_URL/build.json" || echo '{}')
          sha=$(echo "$live" | python -c "import json,sys;print(json.load(sys.stdin).get('sha',''))")
          tag=$(echo "$live" | python -c "import json,sys;print(json.load(sys.stdin).get('tag',''))")
          if [ "$sha" != "$GITHUB_SHA" ] || [ "$tag" != "${{ steps.prev.outputs.tag }}" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide
        id: decide
        run: |
          run=false
          if [ "${{ github.event_name }}" != "schedule" ]; then run=true
          elif [ -n "${{ steps.due.outputs.due }}" ]; then run=true
          elif [ "${{ steps.live.outputs.behind }}" = "true" ]; then run=true
          # Daily full check (revised WASDE editions, watchdogs) on the 16:05 UTC run.
          elif [ "$(date -u +%H%M)" \> "1559" ] && [ "$(date -u +%H%M)" \< "1630" ]; then run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Gate: run=$run due='${{ steps.due.outputs.due }}' behind='${{ steps.live.outputs.behind }}'" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # api.data.gov key for the FAS Export Sales API (code reads FAS_API_KEY, then this).
      USDA_PSD_KEY: ${{ secrets.USDA_PSD_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          activate-environment: true
      - run: uv pip install -e ".[dbt]"

      - name: Restore manifest + bronze (manifest from the newest data release; bronze from bronze-store shards)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.gate.outputs.prev_tag }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No data release yet: full backfill from USDA/ESMIS/FAS"
            usda-reports backfill
            exit 0
          fi
          gh release download "$tag" --pattern manifest.json --dir /tmp/prev --clobber
          cp /tmp/prev/manifest.json data/manifest.json
          # Preferred: the append-only shards this manifest names (v2 manifests only).
          shards=$(usda-reports required-shards)
          missing=""
          if [ -n "$shards" ]; then
            if gh release view "$BRONZE_STORE" >/dev/null 2>&1; then
              mkdir -p /tmp/shards
              for s in $shards; do
                got=false
                for attempt in 1 2 3; do
                  if gh release download "$BRONZE_STORE" --pattern "$s" --dir /tmp/shards --clobber; then
                    got=true
                    break
                  fi
                  echo "::warning::download of $BRONZE_STORE/$s failed (attempt $attempt/3)"
                  sleep $((attempt * 10))
                done
                $got || missing="$missing $s"
              done
              if [ -z "$missing" ] && usda-reports unpack-shards /tmp/shards; then
                echo "Bronze restored from $BRONZE_STORE: $shards" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            else
              missing=" $(echo $shards)"
            fi
            echo "::warning::bronze-store restore failed (missing:${missing:- none, unpack failed}); trying $tag/bronze.tar.gz"
          fi
          # Fallback: the single bronze archive of the data release (v1 manifests, before the
          # first bronze-store shard exists). v2 data releases no longer attach it.
          if ! gh release view "$tag" --json assets -q '.assets[].name' | grep -qx 'bronze.tar.gz'; then
            echo "::error::Cannot restore bronze: $tag has no bronze.tar.gz and the $BRONZE_STORE shard(s)${missing:-} could not be restored."
            exit 1
          fi
          echo "Bronze restored from $tag/bronze.tar.gz (legacy archive)" >> "$GITHUB_STEP_SUMMARY"
          gh release download "$tag" --pattern bronze.tar.gz --dir /tmp/prev --clobber
          usda-reports unpack-bronze /tmp/prev/bronze.tar.gz

      - name: Refresh official release calendar
        # A changed page layout must not block ingestion; the detect watchdog fails the run
        # if the calendar runs out of future dates.
        continue-on-error: true
        run: usda-reports refresh-calendar

      - name: Detect WASDE (new report, revised edition, watchdogs)
        id: detect
        if: github.event_name != 'push'
        run: usda-reports detect ${{ inputs.force_month && format('--force-month {0}', inputs.force_month) || '' }}

      - name: Detect Export Sales (ET-clock guard; backfill on first run)
        id: detect_esr
        # Per-report isolation: an ESR failure keeps the last good ESR data (restored bronze)
        # and must not block WASDE; it is flagged in build.json and opens the alert issue.
        # The pull is parsed and contract-checked before it reaches bronze, and the silver
        # build falls back to the last good ESR snapshot if bronze still holds a bad one.
        # On push it runs only when the gate says Export Sales is due (e.g. the first merge,
        # whose restored manifest has no ESR yet): the backfill then ships with that deploy
        # (mode weekly) instead of waiting for the next scheduled weekday run.
        if: >-
          always() && steps.prev.outcome == 'success' &&
          (github.event_name != 'push' || contains(needs.gate.outputs.due, 'export_sales'))
        continue-on-error: true
        run: usda-reports detect --report export_sales ${{ inputs.force_export_sales && '--force' || '' }}

      - name: Detect NASS crush (ESMIS FatsOils; ET-clock guard; backfill on first run)
        id: detect_crush
        # Per-report isolation, exactly like Export Sales: every zip is parsed and
        # contract-checked before it reaches bronze; a failure keeps the last good crush data,
        # is flagged in build.json and opens the alert issue, and never blocks WASDE or ESR.
        if: >-
          always() && steps.prev.outcome == 'success' &&
          (github.event_name != 'push' || contains(needs.gate.outputs.due, 'oilseed_crush'))
        continue-on-error: true
        run: usda-reports detect --report oilseed_crush ${{ inputs.force_oilseed_crush && '--force' || '' }}

      - name: Detect NASS Crop Progress (ESMIS CropProg; ET-clock guard; backfill on first run)
        id: detect_cp
        # Same isolation as crush. Off-season (December-March) nothing is due, so this step
        # makes no source call; the stale watchdog is measured against the season's last
        # scheduled release, not today.
        if: >-
          always() && steps.prev.outcome == 'success' &&
          (github.event_name != 'push' || contains(needs.gate.outputs.due, 'crop_progress'))
        continue-on-error: true
        run: usda-reports detect --report crop_progress ${{ inputs.force_crop_progress && '--force' || '' }}

      - name: Detect NASS Grain Stocks (ESMIS GraiStoc; ET-clock guard; backfill on first run)
        id: detect_gs
        if: >-
          always() && steps.prev.outcome == 'success' &&
          (github.event_name != 'push' || contains(needs.gate.outputs.due, 'grain_stocks'))
        continue-on-error: true
        run: usda-reports detect --report grain_stocks ${{ inputs.force_grain_stocks && '--force' || '' }}

      - name: Decide
        id: plan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.detect.outputs.new_report }}" = "true" ]; then mode=new
          elif [ "${{ steps.detect_esr.outputs.new_export_sales }}" = "true" ] || [ "${{ steps.detect_crush.outputs.new_oilseed_crush }}" = "true" ] || [ "${{ steps.detect_cp.outputs.new_crop_progress }}" = "true" ] || [ "${{ steps.detect_gs.outputs.new_grain_stocks }}" = "true" ]; then mode=weekly
          elif [ "${{ github.event_name }}" != "schedule" ] || [ "${{ needs.gate.outputs.behind }}" = "true" ]; then mode=rebuild
          else mode=none; fi
          case "$mode" in
            new) tag=$(usda-reports release-tag data) ;;
            weekly) tag=$(usda-reports release-tag weekly --existing "$(gh release list --limit 100 --json tagName -q '.[].tagName' | tr '\n' ' ')") ;;
            rebuild) tag="${{ steps.prev.outputs.tag }}"; [ -n "$tag" ] || tag=$(usda-reports release-tag data) ;;
            *) tag="" ;;
          esac
          failed=""
          [ "${{ steps.detect_esr.outcome }}" = "failure" ] && failed="export_sales"
          [ "${{ steps.detect_crush.outcome }}" = "failure" ] && failed="$failed oilseed_crush"
          [ "${{ steps.detect_cp.outcome }}" = "failure" ] && failed="$failed crop_progress"
          [ "${{ steps.detect_gs.outcome }}" = "failure" ] && failed="$failed grain_stocks"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode · tag: ${tag:-none} · failed reports: ${failed:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build silver → gold → publish
        id: build
        if: always() && steps.plan.outputs.mode != 'none' && steps.prev.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.plan.outputs.tag }}"
          echo "month=$(usda-reports latest-key wasde)" >> "$GITHUB_OUTPUT"
          echo "esr=$(usda-reports latest-key export_sales || true)" >> "$GITHUB_OUTPUT"
          echo "crush=$(usda-reports latest-key oilseed_crush || true)" >> "$GITHUB_OUTPUT"
          echo "cp=$(usda-reports latest-key crop_progress || true)" >> "$GITHUB_OUTPUT"
          echo "gs=$(usda-reports latest-key grain_stocks || true)" >> "$GITHUB_OUTPUT"
          # Sets output `silver_failed` (isolated reports rebuilt from their last good state).
          usda-reports run --tag "$tag"
          # Weekly releases are immutable. A code-only rebuild on top of weekly-X must not
          # point the catalogue at weekly-X assets whose bytes differ from this build's: when
          # any dataset hash differs (or weekly-X has no datasets.json), cut a new weekly tag.
          if [ "${{ steps.plan.outputs.mode }}" = "rebuild" ] && [[ "$tag" == weekly-* ]]; then
            rm -rf /tmp/rel && mkdir -p /tmp/rel
            if gh release download "$tag" --pattern datasets.json --dir /tmp/rel --clobber \
              && [ "$(usda-reports datasets-changed /tmp/rel/datasets.json data/publish/datasets.json)" = "false" ]; then
              echo "Datasets identical to $tag: the catalogue keeps pointing at it." >> "$GITHUB_STEP_SUMMARY"
            else
              tag=$(usda-reports release-tag weekly --existing "$(gh release list --limit 100 --json tagName -q '.[].tagName' | tr '\n' ' ')")
              echo "Datasets differ from the immutable ${{ steps.plan.outputs.tag }}: publishing $tag." >> "$GITHUB_STEP_SUMMARY"
              usda-reports publish --tag "$tag"
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # New/changed bronze files → one new append-only shard per report (sets output
          # `shards`); the manifest copied into the release records which shard holds each file.
          usda-reports pack-shards --out-dir data/shards
          cp data/manifest.json data/publish/manifest.json
          usda-reports build-info --sha "$GITHUB_SHA" --tag "$tag" --failed "${{ steps.plan.outputs.failed }}" --out web/public/build.json
          tar -czf data/publish/web-data.tar.gz -C web/public data

      - uses: actions/setup-node@v4
        if: always() && steps.build.outcome == 'success'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and deploy to Vercel (prebuilt static site)
        id: deploy
        if: always() && steps.build.outcome == 'success'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Repository secret VERCEL_TOKEN is not set"; exit 1; fi
          npm ci
          scope=${VERCEL_SCOPE:+--scope $VERCEL_SCOPE}
          npx vercel@latest link --yes --project "$VERCEL_PROJECT" $scope --token "$VERCEL_TOKEN"
          npx vercel@latest pull --yes --environment=production $scope --token "$VERCEL_TOKEN"
          npx vercel@latest build --prod $scope --token "$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod $scope --token "$VERCEL_TOKEN" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the live site serves this build
        id: verify
        if: always() && steps.deploy.outcome == 'success'
        working-directory: web
        env:
          E2E_BASE_URL: ${{ env.SITE_URL }}
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -fsS -m 20 "$SITE_URL/build.json" || true)
            echo "$live" | grep -q "$GITHUB_SHA" && echo "$live" | grep -q "\"${{ steps.build.outputs.tag }}\"" && break
            echo "waiting for the new deployment to be served ($i)"; sleep 20
          done
          echo "$live" | grep -q "$GITHUB_SHA" || { echo "::error::live site does not serve this build"; exit 1; }
          echo "$live" | grep -q "\"${{ steps.build.outputs.tag }}\"" || { echo "::error::live build.json tag is not ${{ steps.build.outputs.tag }}"; exit 1; }
          export EXPECTED_REPORT_LABEL=$(python -c "import json;print(json.load(open('public/data/meta.json'))['latest']['label'])")
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop

      - name: Publish the versioned data release (commit point)
        if: always() && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.build.outputs.tag }}"
          mode="${{ steps.plan.outputs.mode }}"
          # Bronze shards first: the manifest in the data release points at them.
          shards="${{ steps.build.outputs.shards }}"
          if [ -n "$shards" ]; then
            if ! gh release view "$BRONZE_STORE" >/dev/null 2>&1; then
              gh release create "$BRONZE_STORE" --prerelease --latest=false --title "Bronze store (append-only)" \
                --notes "Raw USDA files as delta shards (bronze__<report>__base / __<YYYY-MM>). Never edited or pruned: every data-* manifest names the shards it was built from."
            fi
            for s in $shards; do gh release upload "$BRONZE_STORE" "data/shards/$s" --clobber; done
          fi
          case "$tag" in
            data-*)
              label=$(python -c "import json;print(json.load(open('web/public/data/meta.json'))['latest']['label'])")
              python - > /tmp/notes.md <<'PY'
          import json
          o = json.load(open("web/public/data/overview.json", encoding="utf-8"))
          print("Automated WASDE data release.\n\n### Headlines\n" + "\n".join(f"- {h['sentence']}" for h in o["highlights"]))
          PY
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release upload "$tag" data/publish/* --clobber
                gh release edit "$tag" --notes-file /tmp/notes.md
              else
                gh release create "$tag" --draft --title "WASDE $label" --notes-file /tmp/notes.md
                gh release upload "$tag" data/publish/*
                gh release edit "$tag" --draft=false --latest
              fi
              ;;
            weekly-*)
              if gh release view "$tag" >/dev/null 2>&1; then
                # Weekly releases are immutable: a rebuild redeploys the site but never edits them.
                echo "Weekly release $tag already exists; left unchanged (immutable)." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              esr="${{ steps.build.outputs.esr }}"
              crush="${{ steps.build.outputs.crush }}"
              cp="${{ steps.build.outputs.cp }}"
              gs="${{ steps.build.outputs.gs }}"
              # Title names what changed in this build (ESR, NASS crush, Crop Progress, Grain Stocks).
              parts=""
              [ "${{ steps.detect_esr.outputs.new_export_sales }}" = "true" ] && parts="Export Sales $esr"
              [ "${{ steps.detect_crush.outputs.new_oilseed_crush }}" = "true" ] && parts="${parts:+$parts · }NASS crush $crush"
              [ "${{ steps.detect_cp.outputs.new_crop_progress }}" = "true" ] && parts="${parts:+$parts · }Crop Progress $cp"
              [ "${{ steps.detect_gs.outputs.new_grain_stocks }}" = "true" ] && parts="${parts:+$parts · }Grain Stocks $gs"
              [ -n "$parts" ] || parts="Rebuild"
              printf 'Automated weekly build: %s. Latest releases included: U.S. Export Sales %s (FAS ESR), NASS Fats & Oils %s, NASS Crop Progress %s, NASS Grain Stocks %s.\n\nPrerelease, never marked Latest: the latest data-* release stays the monthly WASDE release.\n' "$parts" "$esr" "$crush" "$cp" "$gs" > /tmp/notes.md
              gh release create "$tag" --draft --prerelease --latest=false --title "$parts" --notes-file /tmp/notes.md
              gh release upload "$tag" data/publish/*
              gh release edit "$tag" --draft=false --prerelease --latest=false
              ;;
            *) echo "::error::unexpected release tag '$tag'"; exit 1 ;;
          esac

      - name: Record manifest and calendar in git (audit trail + repository activity)
        if: always() && (steps.plan.outputs.mode == 'new' || steps.plan.outputs.mode == 'weekly') && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json config/calendars/
          if [ "${{ steps.plan.outputs.mode }}" = "new" ]; then msg="data: WASDE ${{ steps.build.outputs.month }}"; else msg="data: Export Sales ${{ steps.build.outputs.esr }} · NASS crush ${{ steps.build.outputs.crush }} · Crop Progress ${{ steps.build.outputs.cp }} · Grain Stocks ${{ steps.build.outputs.gs }}"; fi
          git diff --staged --quiet || git commit -m "$msg"
          git pull --rebase --autostash origin main && git push || echo "::warning::audit commit not pushed"

      - name: Heartbeat
        if: always() && github.event_name == 'schedule'
        env:
          HC: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          [ -z "$HC" ] && exit 0
          if [ "${{ job.status }}" = "success" ]; then curl -fsS -m 10 "$HC" >/dev/null; else curl -fsS -m 10 "$HC/fail" >/dev/null; fi

      - name: Open the pipeline-alert issue (once; scheduled retries stay quiet)
        if: failure() || steps.detect_esr.outcome == 'failure' || steps.detect_crush.outcome == 'failure' || steps.detect_cp.outcome == 'failure' || steps.detect_gs.outcome == 'failure' || steps.build.outputs.silver_failed != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} needs attention (event: ${{ github.event_name }}). WASDE watchdogs: ${{ steps.detect.outputs.problems || 'none' }}. Export Sales: ${{ steps.detect_esr.outcome }} ${{ steps.detect_esr.outputs.export_sales_problems }}. NASS crush: ${{ steps.detect_crush.outcome }} ${{ steps.detect_crush.outputs.oilseed_crush_problems }}. Crop Progress: ${{ steps.detect_cp.outcome }} ${{ steps.detect_cp.outputs.crop_progress_problems }}. Grain Stocks: ${{ steps.detect_gs.outcome }} ${{ steps.detect_gs.outputs.grain_stocks_problems }}. Silver fell back to the last good state for: ${{ steps.build.outputs.silver_failed || 'none' }}."
          gh label create pipeline-alert --color B60205 --force >/dev/null
          num=$(gh issue list --label pipeline-alert --state open --json number -q '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --title "Data pipeline needs attention" --label pipeline-alert --body "$body"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            gh issue comment "$num" --body "$body"
          fi
