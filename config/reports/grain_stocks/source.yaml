# NASS Grain Stocks (quarterly, 12:00 ET: January, end of March, end of June, end of September).
#
# Spike 2026-11-09 (ESMIS findByIdentifier/GraiStoc, pages 0..8, no key needed):
#   221 releases, 1973-10-24 -> 2026-09-30; a zip in files[] on 105 of them, from 2001-06-29.
#   The zips hold grst_all_tables.csv (the NASS t/h/u/d/c/f grammar) from 2010-06-30; the
#   older zips carry GRST_ALL.CSV / grst_all.csv in a different layout, so the history starts
#   on 2010-06-30 (plan §3: 2010+). Zip names changed from GraiStoc-MM-DD-YYYY.zip to
#   grst{MMYY}.zip on 2018-09-28 and grst0926_0.zip (a re-post) on 2026-09-30, so URLs come from
#   files[] and release keys from release_datetime. 2019-01-11 lists only a reschedule notice
#   (the report came out on 2019-02-08); 2013-11-19 lists a text file only; 2025-09-30 is
#   listed three times (the highest ESMIS id wins).
#
#   Table 1 of every release (65 checked) is the national summary,
#     "Grain Stocks by Position and Month in Domestic Units – United States: <Y-1> and <Y>"
#     (until 2012: "Grain Stocks by Position and Month – United States: <Y-1> and <Y>
#      (Domestic Units)"; table 2 is the same in metric units and is not used).
#   Header: "Date", then for each of the two years "On farms", "Off farms 1/" (mills,
#   elevators, warehouses, terminals and processors) and "Total all positions". Unit row:
#   "(1,000 bushels)". Rows: a commodity line ("Corn", "All wheat", …) followed by one row per
#   stock date ("March 1" … "December 1"; the 2013-01-11 release prints "1-Mar" …). Every
#   release prints all four dates of both years (blank = not yet published), so silver keeps
#   each date as revised by every later release.
#
# Validation against the published text (grst0926_0.txt, released 2026-09-30): "Old crop corn
# stocks in all positions on September 1, 2026 totaled 2.10 billion bushels ... 787 million
# bushels are stored on-farm", "Old crop soybean stocks ... totaled 315 million bushels",
# "All wheat stocks ... totaled 1.85 billion bushels" = 2,095,057 / 787,300 / 315,133 /
# 1,845,743 thousand bushels in table 1. "June - August 2026 indicated disappearance is 3.20
# billion bushels" (corn) = June 1 5,291,284 - September 1 2,095,057 (no harvest that quarter),
# the G2 identity.
esmis_url: https://esmis.nal.usda.gov/api/v1/release/findByIdentifier/GraiStoc
zip_member: "*_all_tables.csv"
history_start: "2010-06-30"
recheck_last: 2
table:
  # Matched on the title (dash/space-insensitive); "Domestic" picks table 1 over table 2.
  title_prefix: "Grain Stocks by Position and Month"
  must_contain: "Domestic"
  header_first_cell: Date
# Days from the newest stock date to the release (Jan 12 → Dec 1 is 42; the 2019 lapse moved
# the December 1, 2018 report to February 8, 69 days).
release_lag_days: {min: 20, max: 75}
# Commodity line in table 1 -> commodity_id (dbt/seeds/dim_commodity.csv). Others are known
# and skipped; an unknown line fails the report.
commodities:
  "Corn": corn
  "Soybeans": soybeans
  "All wheat": wheat
known_groups: [Sorghum, Oats, Barley, "Durum wheat 2/"]
# Stock date label -> month (the day is always 1).
date_labels:
  "March 1": 3
  "June 1": 6
  "September 1": 9
  "December 1": 12
  "1-Mar": 3
  "1-Jun": 6
  "1-Sep": 9
  "1-Dec": 12
# Header position label (after the year) -> position.
positions:
  "On farms": on_farm
  "Off farms 1/": off_farm
  "Off farms": off_farm
  "Total all positions": total
units:
  "(1,000 bushels)": k_bu
