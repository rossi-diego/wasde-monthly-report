# Canonical vocabulary for the silver layer.
# Keys are matched case/space/punctuation-insensitively (see wasde.silver.text.label_key).
# Any label not listed here is slugified and reported in data/silver/unmapped_labels.json;
# a label that appears for the first time in the newest report fails the monthly run.

