table_patterns:
  - {pattern: "^Reliability of United States \\w+ Projections$", id: reliability_us, label: Reliability of U.S. Projections}
  - {pattern: "^Reliability of \\w+ Projections$", id: reliability_world, label: Reliability of World Projections}

