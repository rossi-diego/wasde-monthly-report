# Report registry. One entry per USDA report; only enabled reports are ingested and built.
# Release times are Eastern Time and always come from here / config/calendars, never from
# source metadata (ESMIS stamps many files with a dummy 12:00Z).
#
#   cadence          monthly | weekly | quarterly
#   release_time_et  publication time on release day (HH:MM, America/New_York)
#   window_h         hours after release_time_et during which `detect` keeps polling
#   grace_days       insight cards go stale after cadence + grace
#   key_env          env var holding the API key (null = no key needed)
#   spec             import path of the ReportSpec implementation
#   release_key_format  month (YYYY-MM, WASDE) | date (YYYY-MM-DD, weekly reports and NASS
#                    monthly reports, whose release month can hold two releases after a shutdown)
#   seasonal         true = released only part of the year (Crop Progress, April-November):
#                    after the season's final release the insights show "season closed"
reports:
  wasde:
    enabled: true
    title: World Agricultural Supply and Demand Estimates
    agency: USDA OCE / WAOB
    cadence: monthly
    release_time_et: "12:00"
    window_h: 6
    grace_days: 45
    key_env: null
    licence: "US Government work, public domain; cite USDA OCE/WAOB (WASDE)"
    min_rows: 3500
    history_start: "2010-07"
    spec: usda_reports.reports.wasde.spec:WasdeSpec

  # Weekly U.S. Export Sales (FAS ESR API). Commodity codes, endpoints and metric mapping:
  # config/reports/export_sales/source.yaml (codes verified against /api/esr/commodities).
  export_sales:
    enabled: true
    title: U.S. Export Sales (ESR)
    agency: USDA FAS
    cadence: weekly
    release_time_et: "08:30"
    window_h: 6
    grace_days: 10
    key_env: FAS_API_KEY  # falls back to USDA_PSD_KEY (same api.data.gov key)
    licence: "US Government work, public domain; cite USDA FAS (Export Sales Reporting Program)"
    min_rows: 20
    history_start: "2010/11"
    release_key_format: date
    spec: usda_reports.reports.export_sales.spec:ExportSalesSpec

  # NASS Fats & Oils (ESMIS findByIdentifier/FatsOils → zip from files[] → cafo_all_tables.csv),
  # soybean table only. Source details verified in the spike: config/reports/oilseed_crush/source.yaml.
  # Released about the first business day of each month at 15:00 ET and covers month − 2
  # (one to three months back during shutdowns). History from 2015-10 only (ESMIS limit).
  oilseed_crush:
    enabled: true
    title: Fats & Oils (soybean crush)
    agency: USDA NASS
    cadence: monthly
    release_time_et: "15:00"
    window_h: 6
    grace_days: 45
    key_env: null
    licence: "US Government work, public domain; cite USDA NASS (Fats & Oils: Oilseed Crushings, Production, Consumption and Stocks)"
    min_rows: 12
    history_start: "2015-10"
    release_key_format: date
    spec: usda_reports.reports.oilseed_crush.spec:OilseedCrushSpec

  # NASS Crop Progress (ESMIS findByIdentifier/CropProg → zip from files[] →
  # prog_all_tables.csv), national rows of corn, soybeans, winter and spring wheat. Weekly on
  # Mondays at 16:00 ET from April through November (holiday Monday → Tuesday); off-season the
  # insight shows a "season closed" state instead of going stale. History from 2010-06-07.
  # Source details verified in the spike: config/reports/crop_progress/source.yaml.
  crop_progress:
    enabled: true
    title: Crop Progress
    agency: USDA NASS
    cadence: weekly
    release_time_et: "16:00"
    window_h: 8
    grace_days: 10
    key_env: null
    licence: "US Government work, public domain; cite USDA NASS (Crop Progress)"
    min_rows: 1
    history_start: "2010-06-07"
    release_key_format: date
    seasonal: true
    spec: usda_reports.reports.crop_progress.spec:CropProgressSpec

  # NASS Grain Stocks (ESMIS findByIdentifier/GraiStoc → zip from files[] →
  # grst_all_tables.csv, table 1), U.S. corn, soybeans and all wheat by position. Quarterly at
  # 12:00 ET (January, end of March, June and September). History from 2010-06-30.
  # Source details verified in the spike: config/reports/grain_stocks/source.yaml.
  grain_stocks:
    enabled: true
    title: Grain Stocks
    agency: USDA NASS
    cadence: quarterly
    release_time_et: "12:00"
    window_h: 6
    grace_days: 100
    key_env: null
    licence: "US Government work, public domain; cite USDA NASS (Grain Stocks)"
    min_rows: 45
    history_start: "2010-06"
    release_key_format: date
    spec: usda_reports.reports.grain_stocks.spec:GrainStocksSpec
