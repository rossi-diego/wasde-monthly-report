# NASS Grain Stocks: quarterly at 12:00 ET (January, with the annual Crop Production and the
# January WASDE; then the last business day of March, June and September), covering stocks on
# December 1, March 1, June 1 and September 1.
#
# History: the actual release dates listed by ESMIS findByIdentifier/GraiStoc with a zip in
# files[], from 2010-06-30 (the first release whose zip holds grst_all_tables.csv) to
# 2026-09-30 (spike 2026-11-09). The 2018-19 funding lapse moved the January 2019 report to
# 2019-02-08 (ESMIS lists a reschedule notice on 2019-01-11); 2013-11-19 is a text notice
# only. 2025-09-30 is listed three times on ESMIS (re-posted files): the highest id is used.
#
# Future dates follow that pattern and must be checked against the NASS Agricultural
# Statistics Board calendar each December (https://www.nass.usda.gov/Publications/Calendar/).
# Detection never depends on them: every run lists ESMIS and ingests what was released; the
# dates only drive the "due" gate, dim_calendar and the overdue watchdog.
source: https://esmis.nal.usda.gov/api/v1/release/findByIdentifier/GraiStoc
