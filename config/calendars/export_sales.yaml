# U.S. Export Sales (FAS ESR): weekly, Thursday 08:30 ET, covering the week that ended the
# previous Thursday. A federal holiday from Monday through Thursday of the release week moves
# the report to Friday (holiday_shift_days: 1).
#
# The live API reports the actual time of the newest release (/api/esr/datareleasedates,
# releaseTimeStamp); detect uses it and only falls back to this calendar for history.
#
# The rule alone is wrong after a federal funding lapse: FAS publishes the missed weeks only
# after the shutdown ends (catch-up releases), so the rule date is EARLIER than the real
# publication. That would misstate when the data was public and ASOF-join an older WASDE than
# the one readers had. `overrides` therefore pins every catch-up week to its actual release
# (silver marks those weeks `release_ts_source: calendar_override`). Any new shutdown must be
# added here from the FAS catch-up notice before the history is rebuilt.
source: https://www.fas.usda.gov/programs/export-sales-reporting-program
release_time_et: "08:30"
rule:
  weekday: thursday
  # First release of marketing year 2010/11 data (wheat MY starts June 1, 2010).
  start: "2010-06-10"
  lag_days: 7
  holiday_shift_days: 1
# Rule-scheduled date (week ending + 7 days, before the holiday shift) -> actual release date.
overrides:
  # 2013 lapse (Oct 1-16, 2013). Hagstrom Report, 2013-10-22, citing FAS: the week ending
  # Sep 26 was posted Friday Oct 18, the week ending Oct 3 on Thursday Oct 24, and sales of
  # Oct 4-24 in the report of Oct 31.
  "2013-10-03": "2013-10-18"
  "2013-10-10": "2013-10-24"
  "2013-10-17": "2013-10-31"
  "2013-10-24": "2013-10-31"
  # 2018-19 lapse (Dec 22, 2018 - Jan 25, 2019). FAS notice of 2019-01-30: week ending Dec 20
  # on Jan 31, Dec 27 on Feb 7, Jan 3 on Feb 14, and weeks ending Jan 10 - Feb 14 combined on
  # Friday Feb 22, 2019; the regular schedule resumed after that.
  "2018-12-27": "2019-01-31"
  "2019-01-03": "2019-02-07"
  "2019-01-10": "2019-02-14"
  "2019-01-17": "2019-02-22"
  "2019-01-24": "2019-02-22"
  "2019-01-31": "2019-02-22"
  "2019-02-07": "2019-02-22"
  "2019-02-14": "2019-02-22"
  "2019-02-21": "2019-02-22"
  # 2025 lapse (Oct 1 - Nov 12, 2025). FAS "Weekly Export Sales Catch-up Schedule" (and the
  # revised schedule of 2025-12-19), all at 08:30 ET: the week ending Sep 18 was the last
  # on-time report (Sep 25); the backlog was cleared twice a week until Jan 8, 2026.
  "2025-10-02": "2025-11-13"  # week ending 2025-09-25
  "2025-10-09": "2025-11-20"  # 2025-10-02
  "2025-10-16": "2025-11-25"  # 2025-10-09
  "2025-10-23": "2025-11-28"  # 2025-10-16
  "2025-10-30": "2025-12-01"  # 2025-10-23
  "2025-11-06": "2025-12-04"  # 2025-10-30
  "2025-11-13": "2025-12-08"  # 2025-11-06
  "2025-11-20": "2025-12-11"  # 2025-11-13
  "2025-11-27": "2025-12-15"  # 2025-11-20
  "2025-12-04": "2025-12-18"  # 2025-11-27
  "2025-12-11": "2025-12-22"  # 2025-12-04
  "2025-12-18": "2025-12-23"  # 2025-12-11
  "2025-12-25": "2025-12-31"  # 2025-12-18
  "2026-01-01": "2026-01-05"  # 2025-12-25
  # week ending 2026-01-01 -> 2026-01-08 is the regular rule again.
cancelled: []
