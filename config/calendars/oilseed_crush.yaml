# NASS Fats & Oils: Oilseed Crushings, Production, Consumption and Stocks. Monthly at 15:00 ET,
# covering the month two months earlier (September data on the first business day of November).
#
# History: the actual release dates listed by ESMIS findByIdentifier/FatsOils (with a zip in
# files[]), 2015-10-01 to 2026-11-02. Shutdowns moved releases: 2019-01-02 was postponed to
# 2019-02-04 (November 2018 data) and 2019-02-22 (December 2018); in 2025 the October release
# moved to 2025-11-21 (August 2025 data) and September 2025 data was first printed on 2025-12-10
# next to October 2025.
#
# Future dates follow NASS's first-business-day pattern (federal holidays skipped) and must be
# checked against the NASS Agricultural Statistics Board calendar each December
# (https://www.nass.usda.gov/Publications/Calendar/). Detection never depends on them: every
# run lists ESMIS and ingests whatever was actually released; the dates only drive the "due"
# gate and the overdue/stale watchdogs.
