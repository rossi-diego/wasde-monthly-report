version: 2

models:
  - name: dim_reports
    description: One row per WASDE report, in publication order.
    columns:
      - name: report_month
        description: Report month (YYYY-MM). WASDE is published once per month at 12:00 ET.
        data_tests: [unique, not_null]
      - name: report_seq
        description: 1-based publication order; consecutive reports differ by 1.
        data_tests: [unique, not_null]
      - name: n_rows
        description: Values published in the report.

  - name: fct_wasde
    description: >
      The complete harmonized WASDE dataset — every table, region, attribute and marketing
      year of every report since July 2010 (ESMIS XML until 2020, USDA CSV from 2021).
    columns:
      - name: series_key
        description: table|commodity|region|attribute — one estimate line across reports.
        data_tests: [not_null]
      - name: report_month
        description: WASDE report month (YYYY-MM); the release key of the report.
      - name: wasde_number
        description: WASDE running report number (e.g. 676).
      - name: release_date
        description: Publication date of the report (12:00 ET).
      - name: source
        description: "Bronze source: usda_csv (OCE CSV, 2021+) or esmis_xml (ESMIS XML, 2010-07 to 2020)."
        data_tests:
          - accepted_values:
              arguments:
                values: [usda_csv, esmis_xml]
      - name: table_id
        description: Harmonized WASDE table id (config/reports/wasde/mappings.yaml).
      - name: table_label
        description: WASDE table title as published.
      - name: commodity_id
        description: Canonical commodity id (config/vocab/commodities.yaml).
      - name: commodity_label
        description: Commodity name as published.
      - name: region_id
        description: Harmonized region id (united_states, world, brazil, …).
      - name: region
        description: Region name as published.
      - name: attribute_id
        description: Harmonized balance-sheet line (production, exports, ending_stocks, …).
      - name: attribute_label
        description: Line name as published.
      - name: reliability_stat
        description: Reliability-table statistic; empty for regular estimates.
      - name: market_year
        description: Marketing year (e.g. 2026/27) or calendar period as published.
      - name: proj_est_flag
        description: "USDA flag: proj (projection), est (estimate) or empty (final)."
      - name: period
        description: annual, or the sub-period for quarterly/monthly lines.
      - name: value
        description: Published value in unit_id.
        data_tests: [not_null]
      - name: unit_id
        description: Unit id (dim_unit), e.g. m_bu, mmt, k_short_tons, m_lbs.
      - name: unit_label
        description: Unit as published.

  - name: fct_revisions
    description: >
      Revision path of each annual estimate (series × marketing year) across reports, with
      month-over-month delta, change vs. first projection and cycle_month
      (0 = first projection in May of the marketing-year start).
    columns:
      - name: delta
        description: Change vs. the immediately preceding report (null if the MY was absent).
      - name: cycle_month
        description: Months since the May first projection; aligns marketing years for comparison.

  - name: fct_balance_sheet
    description: Wide balance sheet per report, table, commodity, region and marketing year.
    columns:
      - name: stocks_to_use_pct
        description: >
          Ending stocks / use × 100. World & World-less-China: use = domestic use (trade nets
          out). U.S. tables and countries: total use (domestic + exports).
      - name: balance_residual
        description: Ending − (beginning + production + imports − domestic − exports).

  - name: fct_ending_stocks_drivers
    description: >
      Month-over-month ending-stocks revision split into beginning stocks, production
      (area and yield effects for U.S. tables), imports, domestic use, exports and other.

  - name: fct_changes
    description: >
      Every month-over-month revision with a seasonal materiality score and the length of
      the current same-direction streak. Input for the monthly highlights.
    columns:
      - name: seasonal_score
        description: "|Δ| divided by the median |Δ| of the same series in the same calendar report month."
